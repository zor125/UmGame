<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>UM! Runner</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-column">
        <header><h1>UM! RUNNER</h1><p>목소리로 달리는 세 가지 리듬</p></header>
        <div class="canvas-wrap">
          <canvas id="game" width="960" height="420" aria-label="러너 게임"></canvas>
          <button id="mic-button" class="mic-button" type="button">Enable microphone</button>
        </div>
        <p class="controls">↓ 슬라이드 · Space 짧은 점프 · ↑ 긴 점프 · R 재시작</p>
      </section>
      <aside id="debug-panel"></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
